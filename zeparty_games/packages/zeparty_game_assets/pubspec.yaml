name: zeparty_game_assets
description: Bundled art, audio and animation assets for all ZeParty mini games plus the asset manifest and loader.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"
dependencies:
  flutter:
    sdk: flutter
  zeparty_game_core:
    path: ../zeparty_game_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/common/audio/
    - assets/common/avatars/
    - assets/common/backgrounds/
    - assets/common/icons/
    - assets/common/particles/
    - assets/common/ui/
