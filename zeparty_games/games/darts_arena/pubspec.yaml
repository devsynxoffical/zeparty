  zeparty_game_ui:
    path: ../../packages/zeparty_game_ui
  zeparty_game_assets:
    path: ../../packages/zeparty_game_assets
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
